# Coordinating-center site metadata for eTable 1 (read by 08_supplement.R).
# One key per site token (lowercase, matching the artifact filenames).
#
# Hospital declaration, one of:
#   hospital_ids   list of literal ADT hospital_id values, lowercased and
#                  trimmed, exactly as the site pipeline sees them (mirrors the
#                  site's config hospital_ids). Defines the reported count and
#                  lets the pooled run name any excluded or missing id.
#   n_hospitals    a bare count, for a site whose ids the coordinating center
#                  does not yet hold. The pooled run reports this number and
#                  warns if the observed count differs. Replace with the list
#                  when the site confirms it.
# Do not give both unless they agree; the pooled run stops if they conflict.
#
# hospitalizations is NOT set here; it comes from each site's flow file.
# Bed counts, study period, and IRB are from the April 2026 submission
# (eTable 1) and carry forward unless a site reports a change.

